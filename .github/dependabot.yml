# Dependabot version updates for the Actions in .github/workflows (the mod itself has no npm
# dependencies). PRs target main, like every other change, grouped into one monthly PR.
# PR titles come out as ci(deps): ..., which pr-title accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch, major]
