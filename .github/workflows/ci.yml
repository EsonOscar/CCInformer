name: CI

# Build and security checks on every PR into main. The checks that judge the PR itself (title,
# version bump) live in pr-gates.yml, so they re-run on title edits without reinstalling anything.
#
# Every job name is a required status check in .github/rulesets/main.json. Renaming a job silently
# breaks protection (the old name stays required and never reports), so update the ruleset in the
# same PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    # The same checks as .githooks/pre-push: the manifest, marketplace file and hooks module must
    # pass `claude plugin validate --strict`, and the mod's tests must pass. Neither needs a login.
    # Runs on the latest Claude Code, as installed machines do: when a new release breaks the mod or
    # tightens the validator, this goes red on the next PR instead of on someone's machine.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Commands run only through the exec lanes
        run: sh .githooks/check-exec.sh

      - name: What the mod does by itself checks its Settings switch
        run: sh .githooks/check-permissions.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest && claude --version

      - name: Validate the plugin
        run: claude plugin validate --strict .

      - name: Run the mod's tests
        run: claude plugin test .

      # The audit-docs skill's scripts are plain Python and a workflow script; their tests run here only, as the
      # pre-push hook can't know which Python a machine uses.
      - name: Run the audit-docs skill's tests
        run: |
          python3 -B -m unittest discover -s skills/audit-docs/tests
          node skills/audit-docs/tests/test_fanout.mjs

      # The planning skills' review script (the final check), run with a stub critic (no model calls).
      - name: Run the plan review script's tests
        run: node skills/plan-feature/tests/test_review.mjs

      # What each kind of workflow agent runs on, in all four workflow scripts: the defaults the mod's Settings show,
      # a set value, the cap. Stub agents, no model calls; under tsx, as it reads the mod's own list of roles.
      - name: The workflow scripts run their agents on the settings
        run: npx -y tsx@4 skills/plan-feature/tests/test_agents.mjs

      # The write-pack skill's template must stay a valid pack naming every key; the mod's own validator decides, run
      # under tsx, as the plugin test kit loads only code files.
      - name: The pack template is valid
        run: npx -y tsx@4 skills/write-pack/tests/check_template.mjs

      # The Godot telemetry script the mod copies into a game can't run here, so its text is held to the contract in
      # hooks/env/telemetry.ts and to what it must never do, under tsx for the same reason.
      - name: The telemetry script keeps its contract
        run: npx -y tsx@4 tests/check-telemetry-asset.mjs

  secret-scan:
    # Fails on a secret (API keys, tokens, private keys...). Scans every commit of the PR, so a secret
    # added and removed again inside the PR is still caught, then the checked-out tree.
    # Config and local-run instructions: .gitleaks.toml
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the PR's commits are scanned one by one
          persist-credentials: false

      - name: Install gitleaks (pinned version, checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$url/$tarball"
          curl -fsSL "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | awk -v f="$tarball" '$2 == f' | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Scan every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose --no-banner --log-opts="$BASE_SHA..$HEAD_SHA"'

      - name: Scan the checked-out tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --verbose --no-banner'
